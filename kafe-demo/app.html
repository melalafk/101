<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Masa101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="/qrcode.js"></script>
<style>
/* Layout: iOS-style. Phone: large title + inset grouped lists + bottom tab bar. iPad/desktop panel: sidebar + content. TV: dark full screen. */
:root {
  --bg: #f2f2f7; --cell: #ffffff; --cell-2: #f2f2f7; --label: #000000; --label-2: rgba(60,60,67,.6); --label-3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.18); --fill: rgba(120,120,128,.12); --fill-2: rgba(120,120,128,.2);
  --tint: #007aff; --tint-soft: rgba(0,122,255,.12); --green: #34c759; --red: #ff3b30; --orange: #ff9500; --yellow: #ffcc00;
  --edge: rgba(242,242,247,.85); --bar: rgba(249,249,249,.82); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --t-red: #ff3b30; --t-blue: #007aff; --t-black: #1c1c1e; --t-yellow: #ff9500;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --cell: #1c1c1e; --cell-2: #2c2c2e; --label: #ffffff; --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.32);
    --tint: #0a84ff; --tint-soft: rgba(10,132,255,.18); --green: #30d158; --red: #ff453a; --orange: #ff9f0a; --yellow: #ffd60a;
    --edge: rgba(0,0,0,.75); --bar: rgba(22,22,24,.8); --shadow: none;
    --t-red: #ff453a; --t-blue: #0a84ff; --t-black: #e5e5ea; --t-yellow: #ff9f0a; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--label); font: 17px/1.29 var(--font); letter-spacing: -.022em; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 720px; margin: 0 auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.num { font-family: var(--round); font-variant-numeric: tabular-nums; }

/* nav + titles */
.navbar { position: sticky; top: 0; z-index: 9; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); transition: background-color .2s; }
/* scroll edge: the bar turns into material only once content passes under it, with a soft fade instead of a hard line */
.navbar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 14px; background: linear-gradient(var(--edge), transparent); opacity: 0; pointer-events: none; transition: opacity .2s; }
body.scrolled .navbar { background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
body.scrolled .navbar::after { opacity: 1; }
.navbar .in { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 44px; max-width: 1200px; margin: 0 auto; }
.navbar .title { font-weight: 600; font-size: 17px; text-align: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navbar .side { min-width: 70px; display: flex; gap: 14px; align-items: center; }
.navbar .side:last-child { justify-content: flex-end; }
.link { color: var(--tint); font-size: 17px; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.large { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.022em; margin: 14px 0 4px; text-wrap: balance; }
.sub { color: var(--label-2); font-size: 15px; margin: 0 0 8px; }
.eyebrow { color: var(--label-2); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }

/* grouped lists */
.sec { margin-top: 26px; }
.sec-h { font-size: 13px; color: var(--label-2); text-transform: uppercase; margin: 0 16px 7px; letter-spacing: .01em; display: flex; justify-content: space-between; gap: 8px; }
.sec-h.big { text-transform: none; font-size: 22px; font-weight: 700; color: var(--label); margin: 0 0 10px; letter-spacing: .01em; }
.sec-f { font-size: 13px; color: var(--label-2); margin: 7px 16px 0; letter-spacing: 0; }
.group { background: var(--cell); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; position: relative; width: 100%; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.row.ind + .row.ind::before { left: 60px; }
.row .grow { flex: 1; min-width: 0; }
.row .t { display: block; }
.row .d { display: block; color: var(--label-2); font-size: 15px; margin-top: 1px; }
.row .val { color: var(--label-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .chev { color: var(--label-3); }
.row.tap { cursor: pointer; }
.row.tap:active { background: var(--fill); }
.row input.inl, .row select.inl, .row textarea.inl { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; text-align: right; color: var(--label-2); font-size: 17px; }
.row textarea.inl { text-align: left; resize: none; }
.icon-sq { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; flex: none; }
.icon-sq svg.i { width: 18px; height: 18px; stroke-width: 2; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pc, var(--label-3)); flex: none; }
.c0 { --pc: var(--t-red); } .c1 { --pc: var(--t-blue); } .c2 { --pc: var(--t-black); } .c3 { --pc: var(--t-yellow); }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 50px; border-radius: 12px; padding: 0 20px; font-weight: 600; font-size: 17px; }
.btn.fill { background: var(--tint); color: #fff; }
.btn.tinted { background: var(--tint-soft); color: var(--tint); }
.btn.gray { background: var(--fill); color: var(--label); }
.btn.red { background: rgba(255,59,48,.12); color: var(--red); }
.btn.small { height: 34px; border-radius: 17px; padding: 0 14px; font-size: 15px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; }
/* press feedback: instant on touch-down, released quickly */
.btn, .plus, .chip, .tcard, .qk button, .sign, .pcard, .stepper button, .side-item, .tabbar button, .link, .seg button { transition: transform 100ms ease-out, opacity 100ms ease-out; touch-action: manipulation; }
.btn:active, .plus:active, .chip:active, .tcard:active, .qk button:active, .sign:active, .stepper button:active { transform: scale(.96); }
.tabbar button:active, .link:active, .side-item:active { opacity: .55; }
.row.tap { transition: background-color 80ms; }
.plus { width: 30px; height: 30px; border-radius: 50%; background: var(--tint-soft); color: var(--tint); display: grid; place-items: center; font-size: 22px; font-weight: 500; line-height: 1; flex: none; }
.stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 9px; height: 32px; flex: none; }
.stepper button { width: 40px; height: 32px; font-size: 20px; color: var(--label); }
.stepper span { min-width: 22px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { height: 30px; border-radius: 7px; font-size: 13px; font-weight: 500; padding: 0 10px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--cell); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }
@media (prefers-color-scheme: dark) { .seg button[aria-pressed="true"] { background: #636366; } }
.switch { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill-2); position: relative; flex: none; cursor: pointer; transition: background .2s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition: transform .2s; }
.switch:checked { background: var(--green); }
.switch:checked::after { transform: translateX(20px); }
.search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; height: 36px; padding: 0 8px; color: var(--label-2); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 17px; color: var(--label); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 32px; border-radius: 16px; padding: 0 14px; background: var(--cell); font-size: 15px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--label); color: var(--bg); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; }
.p-blue { background: var(--tint-soft); color: var(--tint); }
.p-orange { background: rgba(255,149,0,.15); color: var(--orange); }
.p-green { background: rgba(52,199,89,.15); color: var(--green); }
.p-red { background: rgba(255,59,48,.13); color: var(--red); }
.p-gray { background: var(--fill); color: var(--label-2); }
.badge { min-width: 18px; height: 18px; border-radius: 9px; background: var(--red); color: #fff; font-size: 12px; font-weight: 600; display: inline-grid; place-items: center; padding: 0 5px; }

/* tab bar + floating action */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 14px; background: linear-gradient(transparent, var(--edge)); pointer-events: none; }
.tabbar .in { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; max-width: 720px; margin: 0 auto; height: 50px; }
.tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; color: var(--label-2); position: relative; }
.tabbar button[aria-current="page"] { color: var(--tint); }
.tabbar .badge { position: absolute; top: 2px; left: calc(50% + 6px); }
.fab { position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 8; }
.fab .in { max-width: 720px; margin: 0 auto; }
.fab .btn { box-shadow: 0 8px 24px rgba(0,0,0,.18); width: 100%; justify-content: space-between; }

/* menu */
.pop { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 10px; overflow-x: auto; scrollbar-width: none; }
.pop::-webkit-scrollbar { display: none; }
.pcard { background: var(--cell); border-radius: 14px; padding: 12px; display: grid; gap: 10px; text-align: left; }
.thumb { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.thumb svg.i { width: 24px; height: 24px; }
.k0 { background: linear-gradient(160deg, #ff9f0a, #ff6b00); } .k1 { background: linear-gradient(160deg, #5ac8fa, #007aff); }
.k2 { background: linear-gradient(160deg, #ffd60a, #ff9500); } .k3 { background: linear-gradient(160deg, #a2845e, #7b5e3b); }
.pcard .bot { display: flex; justify-content: space-between; align-items: center; }
.price { font-weight: 600; font-variant-numeric: tabular-nums; }
.soldout { opacity: .45; }

/* game */
.rank { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--round); font-weight: 700; font-size: 15px; background: var(--fill); flex: none; }
.rank.first { background: var(--yellow); color: #000; }
.score { font-family: var(--round); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.score.neg, td.neg { color: var(--green); }
.ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ledger th { font-size: 13px; color: var(--label-2); font-weight: 500; padding: 10px 6px; text-align: right; }
.ledger th:first-child, .ledger td:first-child { text-align: left; padding-left: 16px; color: var(--label-2); width: 56px; }
.ledger td { padding: 11px 6px; text-align: right; border-top: .5px solid var(--sep); font-family: var(--round); font-weight: 600; }
.ledger td small { display: block; color: var(--label-2); font-size: 12px; font-weight: 500; font-family: var(--font); }
.ledger th:last-child, .ledger td:last-child { padding-right: 16px; }
.ledger tbody tr { cursor: pointer; }
.ledger tbody tr:active { background: var(--fill); }
.ledger tfoot td { font-size: 19px; background: var(--cell-2); }
.payer { background: var(--cell); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.payer .big { font-size: 22px; font-weight: 700; }
.payer .who { display: grid; gap: 6px; }
.payer .who div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 94vh; overflow-y: auto; background: var(--bg); border-radius: 14px 14px 0 0; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet { overscroll-behavior: contain; will-change: transform; box-shadow: 0 -10px 40px rgba(0,0,0,.12); }
.sheet .grabber, .sheet .sheet-nav { touch-action: none; cursor: grab; }
.sheet.dragging { cursor: grabbing; user-select: none; }
.sheet.closing, .scrim.closing { pointer-events: none; }
.sheet .in { max-width: 640px; margin: 0 auto; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 6px auto 4px; }
.sheet-nav { display: flex; align-items: center; justify-content: space-between; height: 44px; }
.sheet-nav b { font-size: 17px; font-weight: 600; }
.hrow { background: var(--cell); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.hrow + .hrow { margin-top: 8px; }
.hrow.neg { box-shadow: inset 0 0 0 2px var(--green); }
.hrow .top { display: flex; align-items: center; gap: 10px; }
.hrow .nm { flex: 1; min-width: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.hrow .nm small { display: block; font-weight: 400; color: var(--label-2); font-size: 13px; }
.sign { width: 44px; height: 44px; border-radius: 10px; background: var(--fill); font-size: 24px; font-weight: 600; color: var(--label-2); flex: none; }
.sign[aria-pressed="true"] { background: var(--green); color: #fff; }
.hrow input { width: 108px; height: 44px; border: 0; border-radius: 10px; background: var(--fill); text-align: right; padding: 0 12px; font: 700 24px var(--round); font-variant-numeric: tabular-nums; outline: none; }
.hrow input:focus { box-shadow: 0 0 0 2px var(--tint); }
.qk { display: flex; gap: 6px; flex-wrap: wrap; }
.qk button { height: 28px; border-radius: 14px; padding: 0 10px; background: var(--fill); font-size: 13px; font-weight: 500; }
.confirm { background: var(--cell); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; margin-top: 12px; }
.confirm .acts { display: flex; gap: 8px; justify-content: flex-end; }

/* panel */
.split { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.sidebar { display: none; }
@media (min-width: 900px) {
  .split { grid-template-columns: 280px 1fr; }
  .sidebar { display: block; position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: .5px solid var(--sep); background: var(--bg); padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 20px max(12px, env(safe-area-inset-left, 0px)); }
  .panel-tabs { display: none !important; }
}
.sidebar .large { margin: 18px 8px 14px; font-size: 30px; }
.side-item { display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 10px; border-radius: 10px; font-size: 17px; text-align: left; }
.side-item svg.i { color: var(--tint); }
.side-item[aria-current="page"] { background: var(--tint); color: #fff; }
.side-item[aria-current="page"] svg.i { color: #fff; }
.side-item .badge { margin-left: auto; }
.side-item[aria-current="page"] .badge { background: #fff; color: var(--tint); }
.content { min-width: 0; }
.content .page { max-width: 1100px; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
.panel-tabs { overflow-x: auto; scrollbar-width: none; margin-top: 10px; }
.panel-tabs .seg { display: inline-grid; min-width: 100%; }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat { background: var(--cell); border-radius: 12px; padding: 12px 14px; }
.stat small { color: var(--label-2); font-size: 13px; display: block; }
.stat b { font-family: var(--round); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.board { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: start; }
.ticket { background: var(--cell); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.ticket + .ticket { margin-top: 10px; }
.ticket.fresh { animation: glow 1.4s ease-out 2; }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(0,122,255,.5); } 100% { box-shadow: 0 0 0 14px rgba(0,122,255,0); } }
.ticket .th { display: flex; justify-content: space-between; align-items: baseline; }
.ticket .th b { font-size: 22px; font-weight: 700; }
.ticket .th small { color: var(--label-2); font-size: 13px; }
.ticket ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.ticket li b { color: var(--tint); font-variant-numeric: tabular-nums; margin-right: 6px; }
.ticket .note { font-size: 14px; color: var(--orange); }
.callrow { background: rgba(255,149,0,.12); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.callrow + .callrow { margin-top: 8px; }
.tables { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.tcard { background: var(--cell); border-radius: 14px; padding: 14px; display: grid; gap: 6px; text-align: left; min-height: 128px; align-content: start; }
.tcard.idle { background: transparent; box-shadow: inset 0 0 0 1px var(--sep); color: var(--label-2); }
.tcard .th { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tcard .th b { font-size: 20px; font-weight: 700; }
.tcard .amt { font-family: var(--round); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tcard small { color: var(--label-2); font-size: 13px; }
.qrs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.qrcard { background: var(--cell); border-radius: 14px; padding: 16px; display: grid; gap: 8px; justify-items: center; text-align: center; }
.qrcard .qr { width: 100%; max-width: 170px; aspect-ratio: 1; background: #fff; border-radius: 8px; padding: 6px; }
.qrcard .qr svg { width: 100%; height: auto; display: block; }
.qrcard b { font-size: 20px; }
.qrcard small { color: var(--label-2); font-size: 12px; word-break: break-all; }

/* launcher */
.hero-qr { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: center; background: var(--cell); border-radius: 16px; padding: 18px; }
@media (min-width: 640px) { .hero-qr { grid-template-columns: 180px 1fr; } }
.hero-qr .qr { width: 180px; max-width: 100%; aspect-ratio: 1; background: #fff; border-radius: 10px; padding: 8px; }
.hero-qr .qr svg { width: 100%; height: auto; display: block; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--label-2); font-size: 15px; }

/* tv */
.tv { min-height: 100vh; background: #000; color: #fff; padding: 28px 36px; display: grid; gap: 24px; grid-template-rows: auto 1fr; }
.tv header { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }
.tv h1 { margin: 0; font-size: clamp(28px, 3.4vw, 52px); font-weight: 700; letter-spacing: -.022em; line-height: 1.05; }
.tv .clock { font-family: var(--round); font-size: clamp(24px, 3vw, 44px); font-weight: 600; color: rgba(235,235,245,.6); font-variant-numeric: tabular-nums; }
.tv .grid { display: grid; gap: 22px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { .tv .grid { grid-template-columns: 2.2fr 1fr; } }
.tv .live { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); align-content: start; }
.tvcard { background: #1c1c1e; border-radius: 20px; padding: 20px 22px; display: grid; gap: 12px; align-content: start; align-self: start; }
.tvcard .th { display: flex; justify-content: space-between; align-items: baseline; }
.tvcard .th b { font-size: 28px; }
.tvcard .th span { color: rgba(235,235,245,.6); font-size: 18px; }
.tvrow { display: flex; align-items: center; gap: 12px; font-size: 22px; }
.tvrow .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tvrow .s { font-family: var(--round); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; }
.tvrow .rank { width: 34px; height: 34px; font-size: 18px; background: #2c2c2e; color: #fff; }
.tvrow .rank.first { background: #ffd60a; color: #000; }
.tv .lb { background: #1c1c1e; border-radius: 20px; padding: 20px 22px; align-self: start; }
.tv .lb h2 { margin: 0 0 12px; font-size: 26px; }
.tv .lb .tvrow + .tvrow { margin-top: 12px; }
.tv .empty { color: rgba(235,235,245,.6); font-size: 22px; padding: 30px; text-align: center; background: #1c1c1e; border-radius: 20px; }

.empty-state { text-align: center; padding: 34px 20px; color: var(--label-2); background: var(--cell); border-radius: 12px; }
.empty-state b { display: block; color: var(--label); font-size: 20px; margin-bottom: 6px; }
.toast { position: fixed; left: 50%; top: calc(54px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; background: var(--bar); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 8px 30px rgba(0,0,0,.18); border-radius: 22px; padding: 12px 18px; font-size: 15px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 32px); animation: materialize .32s cubic-bezier(.2,.9,.25,1); }
@keyframes materialize { from { opacity: 0; transform: translate(-50%, -10px) scale(.92); filter: blur(8px); } }
.toast svg.i { color: var(--green); }
.offline { position: fixed; left: 0; right: 0; top: 0; z-index: 40; background: var(--red); color: #fff; text-align: center; font-size: 13px; padding: calc(4px + env(safe-area-inset-top, 0px)) 8px 4px; }
@media (prefers-reduced-motion: reduce) {
  .ticket.fresh { animation: none; } .switch, .switch::after { transition: none; }
  .toast { animation: fade .2s ease; }
  .btn:active, .plus:active, .chip:active, .tcard:active, .qk button:active, .sign:active, .stepper button:active { transform: none; opacity: .6; }
}
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-transparency: reduce) {
  body.scrolled .navbar, .tabbar, .toast { background: var(--cell); backdrop-filter: none; -webkit-backdrop-filter: none; }
}
@media (prefers-contrast: more) {
  :root { --sep: rgba(60,60,67,.6); --label-2: rgba(60,60,67,.85); }
  .group, .ticket, .tcard, .stat, .payer, .qrcard, .hrow, .btn.gray, .btn.tinted, .chip, .search { box-shadow: inset 0 0 0 1px var(--sep); }
  body.scrolled .navbar, .tabbar { background: var(--cell); backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: 0 1px 0 var(--sep); }
}
@media print {
  body { background: #fff; }
  .sidebar, .navbar, .panel-tabs, .noprint, .tabbar, .fab { display: none !important; }
  .split { display: block; }
  .qrs { grid-template-columns: repeat(3, 1fr); }
  .qrcard { break-inside: avoid; border: 1px solid #ccc; color: #000; background: #fff; }
}
</style>
</head>
<body>
<div id="root"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>
<div id="offline" class="offline" hidden>Bağlantı yok, yeniden deneniyor…</div>
<script>
(() => {
const qs = new URLSearchParams(location.search);
const ROOM = (qs.get("k") || "demo");
const API = "/api/state?k=" + encodeURIComponent(ROOM);
const COLORS = ["c0", "c1", "c2", "c3"];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n < 0 ? "−" : "") + Math.abs(n);
const tl = n => "₺" + n.toLocaleString("tr-TR");
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const IC = {
  menu: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  game: '<rect x="3.5" y="5" width="7.5" height="14" rx="2"/><rect x="13" y="5" width="7.5" height="14" rx="2"/><path d="M7.2 10v4M16.8 10v4"/>',
  bill: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  tray: '<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  qr: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3.5 4M16 6h3a3 3 0 0 1-3.5 4M12 13v4M8.5 20h7"/>',
  tv: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 20h8"/>',
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  ipad: '<rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  card: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h3"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  cup: '<path d="M5 9h11v5a5 5 0 0 1-10 0z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5v2M11 3.5v2"/>',
  glass: '<path d="M7 4h10l-1.4 15a2 2 0 0 1-2 1.8h-3.2a2 2 0 0 1-2-1.8z"/><path d="M7.6 9h8.8"/>',
  food: '<path d="M4 12a8 5 0 0 1 16 0z"/><path d="M3 15h18M5 18h14"/>',
  nut: '<ellipse cx="12" cy="13" rx="6" ry="7"/><path d="M12 6v14M9 3.5l3 2.5 3-2.5"/>',
  sound: '<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/>',
  print: '<path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/>',
};
const ic = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const CAT_ICON = ["cup", "glass", "food", "nut"];

let S = null, lastV = -1, pendingRender = false;
let tableNo = +qs.get("masa") || ls.get("m101.table", 4);
if (qs.get("masa")) ls.set("m101.table", tableNo);
let custTab = ls.get("m101.ctab", "menu");
let cat = -1, query = "";
let cart = ls.get("m101.cart." + ROOM + "." + tableNo, {});
let payMode = "loser";
let draft = null;
let soundOn = false, seen = null;

/* ---------- server ---------- */
async function pull() {
  try {
    const r = await fetch(API, { cache: "no-store" }); if (!r.ok) throw 0;
    setState(await r.json()); $("#offline").hidden = true;
  } catch (e) { $("#offline").hidden = false; }
}
async function act(a) {
  try {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(a) });
    if (!r.ok) throw 0;
    setState(await r.json()); $("#offline").hidden = true; return true;
  } catch (e) { $("#offline").hidden = false; toast("Gönderilemedi. Bağlantıyı kontrol edin.", false); return false; }
}
function setState(ns) {
  S = ns;
  const fresh = S.orders.filter(o => o.status === "new" && !o.paid);
  if (seen && fresh.some(o => !seen.has(o.id)) && route().v === "panel") beep();
  seen = new Set(S.orders.map(o => o.id));
  if (S.v !== lastV) { lastV = S.v; render(); }
}
const item = id => S.menu.find(m => m.id === id) || { n: "Ürün", p: 0, c: 0 };
const orderTotal = o => o.items.reduce((a, x) => a + item(x.id).p * x.q, 0);
const tOrders = t => S.orders.filter(o => o.table === t && !o.paid);
const tBill = t => tOrders(t).reduce((a, o) => a + orderTotal(o), 0);
const ago = t => { const m = Math.max(0, Math.round(((S.now || Date.now()) - t) / 60000)); return m < 1 ? "şimdi" : m < 60 ? m + " dk önce" : Math.floor(m / 60) + " sa önce"; };
function sides(g) {
  const t = g.players.map(() => 0); g.hands.forEach(h => h.forEach((v, i) => t[i] += v));
  if (g.mode === "team") return [[0, 2], [1, 3]].map((tm, k) => ({ name: g.teamNames[k], members: tm.map(i => g.players[i]), total: t[tm[0]] + t[tm[1]], color: COLORS[k], sub: tm.map(i => `${g.players[i]} ${fmt(t[i])}`).join(" · ") }));
  return g.players.map((n, i) => ({ name: n, members: [n], total: t[i], color: COLORS[i], sub: "" }));
}
const colorOf = (g, i) => g.mode === "team" ? COLORS[i % 2] : COLORS[i];

/* ---------- routing ---------- */
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith("panel")) return { v: "panel", sub: h.split("-")[1] || "siparis" };
  if (h === "musteri") return { v: "musteri" };
  if (h === "tv") return { v: "tv" };
  return { v: "start" };
}
function render(force) {
  if (!S) { $("#root").innerHTML = `<div class="page gut"><p class="sub" style="margin-top:40vh;text-align:center">Yükleniyor…</p></div>`; return; }
  const ae = document.activeElement;
  if (!force && ae && ae.closest && ae.closest("#root") && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) { pendingRender = true; return; }
  pendingRender = false;
  const r = route();
  document.body.style.background = r.v === "tv" ? "#000" : "";
  if (r.v === "musteri") renderCustomer();
  else if (r.v === "panel") renderPanel(r.sub);
  else if (r.v === "tv") renderTV();
  else renderStart();
  if (draft && draft.kind === "hand") drawHand(false);
}
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender) render(); }, 50));

/* ================= START (demo launcher) ================= */
function link(hash, extra = {}) {
  const p = new URLSearchParams({ k: ROOM, ...extra });
  return location.origin + "/?" + p.toString() + hash;
}
function qrSvg(text) {
  try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
  catch (e) { return `<div style="color:#000;font-size:12px;padding:8px">${esc(text)}</div>`; }
}
function renderStart() {
  const url = link("#musteri", { masa: tableNo });
  $("#root").innerHTML = `
  <div class="page gut">
    <p class="eyebrow" style="margin-top:28px">Demo</p>
    <h1 class="large">Masa101</h1>
    <p class="sub">Okey masası için QR menü, ortak skor ve “kaybeden öder” hesap. ${esc(S.cafe)} örneğiyle.</p>
    <div id="lanHint"></div>

    <div class="sec">
      <div class="hero-qr">
        <div class="qr">${qrSvg(url)}</div>
        <div>
          <b style="font-size:20px">Telefonunuzla okutun</b>
          <p class="sub" style="margin-top:6px">Masa ${tableNo}'a oturan müşteri gibi menüyü açın, sipariş verin, oyunu başlatın.</p>
          <ol class="steps">
            <li>Bu ekranı tablette açık tutun, aşağıdan <b>Kafe paneli</b>ne geçin.</li>
            <li>Telefonla QR'ı okutup bir çay sipariş edin.</li>
            <li>Sipariş tablete sesli düşer. Oyunu bitirince hesap kaybedene yazılır.</li>
          </ol>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h"><span>Ekranlar</span></div>
      <div class="group">
        <a class="row tap ind" href="#musteri" style="color:inherit;text-decoration:none"><span class="icon-sq" style="background:var(--green)">${ic("phone")}</span><span class="grow"><span class="t">Müşteri ekranı</span><span class="d">Masadaki QR'ı okutan müşterinin telefonu</span></span><span class="chev">${ic("chev")}</span></a>
        <a class="row tap ind" href="#panel" style="color:inherit;text-decoration:none"><span class="icon-sq" style="background:var(--tint)">${ic("ipad")}</span><span class="grow"><span class="t">Kafe paneli</span><span class="d">Tezgâhtaki tablet: siparişler, masalar, menü</span></span><span class="chev">${ic("chev")}</span></a>
        <a class="row tap ind" href="#tv" style="color:inherit;text-decoration:none"><span class="icon-sq" style="background:#5856d6">${ic("tv")}</span><span class="grow"><span class="t">TV ekranı</span><span class="d">Duvardaki televizyon: canlı skorlar ve liderler</span></span><span class="chev">${ic("chev")}</span></a>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h"><span>Demo ayarları</span></div>
      <div class="group">
        <label class="row"><span class="grow">Bu cihazın masası</span>
          <select class="inl" id="tSel" style="flex:none;width:auto">${Array.from({ length: S.tables }, (_, i) => `<option value="${i + 1}" ${i + 1 === tableNo ? "selected" : ""}>Masa ${i + 1}</option>`).join("")}</select></label>
        <button class="row tap" id="resetBtn" style="color:var(--red)">Demoyu sıfırla</button>
      </div>
      <p class="sec-f">Kafeye özel demo için adresin sonuna ?k=kafeadi ekleyin. Her adres ayrı çalışır.</p>
      <div id="resetBox"></div>
    </div>
  </div>`;
  if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
    fetch("/api/lan").then(r => r.ok ? r.json() : null).then(d => {
      const box = $("#lanHint"); if (!box || !d || !d.url) return;
      const u = d.url + "/" + location.search + location.hash;
      box.innerHTML = `<div class="callrow" style="margin-top:12px;display:block"><b>QR kodları telefonda açılmaz</b><br><span style="font-size:15px">Bu sayfa “localhost” adresinden açık. Telefonların bağlanabilmesi için şu adresten açın: <a class="link" href="${esc(u)}">${esc(d.url)}</a></span></div>`;
    }).catch(() => {});
  }
  $("#tSel").onchange = e => { tableNo = +e.target.value; ls.set("m101.table", tableNo); cart = ls.get(cartKey(), {}); render(true); };
  $("#resetBtn").onclick = () => confirmBox("#resetBox", "Tüm siparişler, oyunlar ve menü değişiklikleri silinip demo baştan kurulsun mu?", "Sıfırla", async () => { await act({ type: "reset" }); cart = {}; saveCart(); toast("Demo sıfırlandı"); });
}

/* ================= CUSTOMER ================= */
const cartKey = () => "m101.cart." + ROOM + "." + tableNo;
const saveCart = () => ls.set(cartKey(), cart);
function renderCustomer() {
  const g = S.games[tableNo];
  const bill = tBill(tableNo);
  const myCount = tOrders(tableNo).filter(o => o.status !== "done").length;
  const tabs = [["menu", "Menü", "menu", myCount], ["oyun", "Oyun", "game", 0], ["hesap", "Hesap", "bill", 0]];
  let body = "";
  if (custTab === "oyun") body = customerGame(g);
  else if (custTab === "hesap") body = customerBill(g, bill);
  else body = customerMenu();
  $("#root").innerHTML = `
    <div class="navbar"><div class="in gut"><span class="side"><a class="link" href="#">${ic("back")}Demo</a></span><span class="title">${esc(S.cafe)}</span><span class="side"><span class="pill p-blue">Masa ${tableNo}</span></span></div></div>
    <div class="page gut">${body}</div>
    <div id="fab"></div>
    <nav class="tabbar"><div class="in">${tabs.map(([k, l, i, b]) => `<button data-ct="${k}" aria-current="${custTab === k ? "page" : "false"}">${ic(i)}${l}${b ? `<span class="badge">${b}</span>` : ""}</button>`).join("")}</div></nav>`;
  $$("[data-ct]").forEach(b => b.onclick = () => { custTab = b.dataset.ct; ls.set("m101.ctab", custTab); render(true); window.scrollTo(0, 0); });
  if (custTab === "menu") bindMenu(); else if (custTab === "oyun") bindGame(g); else bindBill(g, bill);
}

/* --- menu --- */
function customerMenu() {
  const q = query.trim().toLocaleLowerCase("tr");
  const list = S.menu.filter(m => (cat < 0 || m.c === cat) && (!q || m.n.toLocaleLowerCase("tr").includes(q) || (m.d || "").toLocaleLowerCase("tr").includes(q)));
  const pop = S.menu.filter(m => m.pop && m.on);
  const rowFor = m => {
    const n = cart[m.id] || 0;
    return `<div class="row ${m.on ? "" : "soldout"}">
      <span class="thumb k${m.c}">${ic(CAT_ICON[m.c] || "cup")}</span>
      <span class="grow"><span class="t">${esc(m.n)}</span><span class="d">${m.on ? esc(m.d || "") : "Şu an yok"}</span><span class="price" style="display:block;margin-top:3px">${tl(m.p)}</span></span>
      ${!m.on ? "" : n ? `<span class="stepper"><button data-dec="${m.id}" aria-label="Azalt">−</button><span>${n}</span><button data-inc="${m.id}" aria-label="Artır">+</button></span>` : `<button class="plus" data-inc="${m.id}" aria-label="${esc(m.n)} ekle">+</button>`}
    </div>`;
  };
  const groups = (cat < 0 ? S.cats.map((_, i) => i) : [cat]).map(c => {
    const items = list.filter(m => m.c === c);
    return items.length ? `<div class="sec"><div class="sec-h"><span>${esc(S.cats[c])}</span></div><div class="group">${items.map(rowFor).join("")}</div></div>` : "";
  }).join("");
  const mine = tOrders(tableNo).slice().reverse();
  const st = { new: ["Alındı", "p-blue"], prep: ["Hazırlanıyor", "p-orange"], done: ["Masada", "p-green"] };
  return `
    <h1 class="large">Menü</h1>
    <label class="search">${ic("search")}<input id="q" type="search" placeholder="Ara" value="${esc(query)}" autocomplete="off"></label>
    <div class="chips"><button class="chip" data-cat="-1" aria-pressed="${cat < 0}">Tümü</button>${S.cats.map((c, i) => `<button class="chip" data-cat="${i}" aria-pressed="${cat === i}">${esc(c)}</button>`).join("")}</div>
    ${!q && cat < 0 && pop.length ? `<div class="sec"><div class="sec-h"><span>Çok sipariş edilenler</span></div><div class="pop">${pop.map(m => `
      <div class="pcard"><span class="thumb k${m.c}">${ic(CAT_ICON[m.c])}</span><span><b>${esc(m.n)}</b><br><small style="color:var(--label-2)">${esc(m.d || "")}</small></span>
      <span class="bot"><span class="price">${tl(m.p)}</span><button class="plus" data-inc="${m.id}" aria-label="${esc(m.n)} ekle">+</button></span></div>`).join("")}</div></div>` : ""}
    ${groups || `<div class="sec"><div class="empty-state"><b>Sonuç yok</b>Başka bir kelime deneyin.</div></div>`}
    ${mine.length ? `<div class="sec"><div class="sec-h"><span>Siparişleriniz</span></div><div class="group">${mine.map(o => `
      <div class="row"><span class="grow"><span class="t">${o.items.map(x => `${x.q}× ${esc(item(x.id).n)}`).join(", ")}</span><span class="d">${ago(o.t)} · ${tl(orderTotal(o))}</span></span><span class="pill ${st[o.status][1]}">${st[o.status][0]}</span></div>`).join("")}</div></div>` : ""}`;
}
function bindMenu() {
  const qi = $("#q");
  qi.oninput = () => { query = qi.value; const pos = qi.selectionStart; render(true); const n = $("#q"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} };
  $$("[data-cat]").forEach(b => b.onclick = () => { cat = +b.dataset.cat; render(true); });
  $$("[data-inc]").forEach(b => b.onclick = () => { cart[b.dataset.inc] = (cart[b.dataset.inc] || 0) + 1; saveCart(); render(true); });
  $$("[data-dec]").forEach(b => b.onclick = () => { cart[b.dataset.dec] = Math.max(0, (cart[b.dataset.dec] || 0) - 1); if (!cart[b.dataset.dec]) delete cart[b.dataset.dec]; saveCart(); render(true); });
  const lines = Object.entries(cart).filter(([id, q]) => q > 0 && S.menu.some(m => m.id === id && m.on));
  const n = lines.reduce((a, [, q]) => a + q, 0), sum = lines.reduce((a, [id, q]) => a + item(id).p * q, 0);
  $("#fab").innerHTML = n ? `<div class="fab"><div class="in gut"><button class="btn fill" id="openCart"><span>Sepet · ${n} ürün</span><span>${tl(sum)}</span></button></div></div>` : "";
  const oc = $("#openCart"); if (oc) oc.onclick = openCart;
}
function openCart() {

const parse = s => { const n = parseInt(String(s).replace(/[^0-9-]/g, "")); return isNaN(n) ? 0 : n; };
function openHand(idx) {

          <div class="top"><span class="nm"><span class="dot ${colorOf(g, i)}"></span><span>${esc(g.players[i])}<small id="rt${i}">Toplam ${fmt(before[i] + parse(v))}</small></span></span>

        </div>`;

      <div style="display:grid;grid-template-columns:${draft.idx != null ? "auto 1fr" : "1fr"};gap:10px;margin-top:16px">

        <button class="btn fill" id="hSave">Eli Kaydet</button>
      </div>
    </div></div>`;
  mountSheet(true);
  const upd = i => {
    const neg = $(`[data-sign="${i}"]`).getAttribute("aria-pressed") === "true";
    const d = $("#hv" + i).value.replace(/[^0-9]/g, "");
    draft.v[i] = d === "" ? "" : (neg ? "-" : "") + d;

  });
  $$("[data-sign]").forEach(b => b.onclick = () => { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); upd(+b.dataset.sign); $("#hv" + b.dataset.sign).focus(); });
  const setVal = (i, val) => { const n = parse(val); $("#hv" + i).value = Math.abs(n) || ""; $(`[data-sign="${i}"]`).setAttribute("aria-pressed", n < 0); upd(i); const k = order.indexOf(i); if (k < order.length - 1) inputs[k + 1].focus(); };

    if (ok) { haptic(); closeLayer(); render(true); }
  };
  $("#hSave").onclick = $("#hSave2").onclick = save;
  $("#scrim").onclick = $("#hClose").onclick = () => { closeLayer(); render(true); };
  const del = $("#hDel"); if (del) del.onclick = () => confirmBox("#hConf", `${no}. el silinsin mi?`, "Sil", async () => { const d = draft; if (await act({ type: "handDel", table: tableNo, idx: d.idx })) { closeLayer(); render(true); } });

/* --- bill --- */
function billLines(orders) {
  const m = {}; orders.forEach(o => o.items.forEach(x => { m[x.id] = (m[x.id] || 0) + x.q; }));
  return Object.entries(m).map(([id, q]) => ({ id, n: item(id).n, q, sum: item(id).p * q }));
}
function payerCard(g, bill, mode, withSeg) {
  if (!g || !g.hands.length || !bill) return "";
  const sd = sides(g).sort((a, b) => b.total - a.total);
  const loser = sd[0]; const people = sides(g).flatMap(s => s.members);
  const per = n => tl(Math.ceil(bill / n));
  return `<div class="sec"><div class="payer">
    ${withSeg ? `<div class="seg" id="payMode"><button data-p="loser" aria-pressed="${mode === "loser"}">Kaybeden öder</button><button data-p="split" aria-pressed="${mode === "split"}">Eşit böl</button></div>` : ""}
    ${mode === "loser"
      ? `<div><span class="eyebrow">${g.hands.length}. el sonunda</span><div class="big">${esc(loser.name)} öder</div></div>
         <div class="who">${loser.members.map(n => `<div><span>${esc(n)}</span><b>${per(loser.members.length)}</b></div>`).join("")}</div>`
      : `<div class="who">${people.map(n => `<div><span>${esc(n)}</span><b>${per(people.length)}</b></div>`).join("")}</div>`}
  </div></div>`;
}
function customerBill(g, bill) {
  const lines = billLines(tOrders(tableNo));
  const callG = S.calls.some(c => c.table === tableNo && c.kind === "garson");
  const callH = S.calls.some(c => c.table === tableNo && c.kind === "hesap");
  return `

    <div class="sec"><div class="group">
      ${lines.length ? lines.map(l => `<div class="row"><span class="grow">${l.q}× ${esc(l.n)}</span><span class="val">${tl(l.sum)}</span></div>`).join("") : `<div class="row"><span class="grow" style="color:var(--label-2)">Henüz sipariş yok</span></div>`}
      <div class="row"><span class="grow"><b>Toplam</b></span><b class="num" style="font-size:22px">${tl(bill)}</b></div>
    </div></div>
    ${payerCard(g, bill, payMode, true)}
    <div class="sec"><div class="group">

function beep(force) {
  if (!soundOn && !force) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .16].forEach((d, k) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = k ? 1318 : 988; o.connect(g); g.connect(actx.destination);
      const t0 = actx.currentTime + d; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.22, t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + .22); o.start(t0); o.stop(t0 + .24); });
  } catch (e) {}
}

function panelTables() {
  const open = S.orders.filter(o => !o.paid);
  const openSum = open.reduce((a, o) => a + orderTotal(o), 0);
  const busy = new Set([...open.map(o => o.table), ...Object.keys(S.games).map(Number)]);
  const closed = S.orders.filter(o => o.paid).reduce((a, o) => a + orderTotal(o), 0);
  return `
    <div class="stats">
      <div class="stat"><small>Açık hesaplar</small><b>${tl(openSum)}</b></div>
      <div class="stat"><small>Dolu masa</small><b>${busy.size}/${S.tables}</b></div>
      <div class="stat"><small>Bugün kapanan</small><b>${tl(closed)}</b></div>
      <div class="stat"><small>Süren oyun</small><b>${Object.keys(S.games).length}</b></div>
    </div>
    <div class="sec tables">${Array.from({ length: S.tables }, (_, k) => {
      const t = k + 1, bill = tBill(t), g = S.games[t], calls = S.calls.filter(c => c.table === t);
      let game = "";
      if (g && g.hands.length) { const sd = sides(g).sort((a, b) => a.total - b.total); game = `<small>${g.mode === "team" ? "Eşli" : "Tekli"} · ${g.hands.length}. el · Önde ${esc(sd[0].name)}</small><small>Hesap: <b style="color:var(--label)">${esc(sd[sd.length - 1].name)}</b></small>`; }
      else if (g) game = `<small>Oyun başladı</small>`;
      const idle = !bill && !g && !calls.length;
      return `<button class="tcard ${idle ? "idle" : ""}" data-t="${t}">
        <span class="th"><b>Masa ${t}</b><span>${calls.map(c => `<span class="pill p-orange">${c.kind === "hesap" ? "Hesap" : "Garson"}</span>`).join(" ")}</span></span>
        <span class="amt">${bill ? tl(bill) : idle ? "Boş" : tl(0)}</span>${game}</button>`;
    }).join("")}</div>`;
}
function bindTables() { $$("[data-t]").forEach(b => b.onclick = () => openTable(+b.dataset.t)); }
function openTable(t) {
  const lines = billLines(tOrders(t)), bill = tBill(t), g = S.games[t];
  draft = { kind: "table" };
  $("#layer").innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Masa ${t}"><div class="in gut">
      <div class="grabber"></div>
      <div class="sheet-nav"><button class="link" id="tClose">Kapat</button><b>Masa ${t}</b><span style="width:52px"></span></div>
      <div class="group" style="margin-top:8px">${lines.length ? lines.map(l => `<div class="row"><span class="grow">${l.q}× ${esc(l.n)}</span><span class="val">${tl(l.sum)}</span></div>`).join("") : `<div class="row" style="color:var(--label-2)">Sipariş yok</div>`}
        <div class="row"><span class="grow"><b>Toplam</b></span><b class="num" style="font-size:22px">${tl(bill)}</b></div></div>
      ${payerCard(g, bill, "loser", false)}
      ${bill || g ? `<div class="sec"><button class="btn fill block" id="pay">Ödendi, Masayı Kapat</button><div id="payBox"></div></div>` : ""}
    </div></div>`;
  mountSheet(true);
  $("#scrim").onclick = $("#tClose").onclick = () => { closeLayer(); };
  const p = $("#pay"); if (p) p.onclick = () => confirmBox("#payBox", `Masa ${t} hesabı ödendi olarak kapansın mı? Oyun varsa biter ve sonucu liderlik tablosuna yazılır.`, "Kapat", async () => { if (await act({ type: "close", table: t })) { haptic(); closeLayer(); toast(`Masa ${t} kapandı`); } });
}

function bindPanelMenu() {
  $$("[data-tog]").forEach(el => el.onchange = () => act({ type: "menuToggle", id: el.dataset.tog, on: el.checked }).then(ok => ok && toast(el.checked ? "Satışa açıldı" : "Menüde “Şu an yok” görünecek")));
  $$("[data-edit]").forEach(b => b.onclick = () => editItem(S.menu.find(m => m.id === b.dataset.edit)));
  $("#addItem").onclick = () => editItem(null);

}
function editItem(m) {
  const it = m || { n: "", d: "", p: "", c: 0 };
  draft = { kind: "item" };
  $("#layer").innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Ürün"><div class="in gut">
      <div class="grabber"></div>
      <div class="sheet-nav"><button class="link" id="iClose">Vazgeç</button><b>${m ? "Ürünü Düzenle" : "Yeni Ürün"}</b><button class="link" id="iSave" style="font-weight:600">Kaydet</button></div>
      <div class="group" style="margin-top:8px">
        <label class="row"><span style="width:90px">Ad</span><input class="inl" style="text-align:left;color:var(--label)" id="iN" value="${esc(it.n)}" maxlength="40" placeholder="ör. Bitki çayı"></label>
        <label class="row"><span style="width:90px">Açıklama</span><input class="inl" style="text-align:left;color:var(--label)" id="iD" value="${esc(it.d || "")}" maxlength="80" placeholder="İsteğe bağlı"></label>
        <label class="row"><span style="width:90px">Fiyat (₺)</span><input class="inl" style="text-align:left;color:var(--label)" id="iP" value="${esc(it.p)}" inputmode="numeric" placeholder="0"></label>
        <label class="row"><span style="width:90px">Kategori</span><select class="inl" style="text-align:left;color:var(--label)" id="iC">${S.cats.map((c, i) => `<option value="${i}" ${i === it.c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></label>
      </div>
      <p class="sec-f" id="iErr"></p>
      ${m ? `<div class="sec"><div class="group"><button class="row tap" id="iDel" style="color:var(--red)">Ürünü sil</button></div><div id="iBox"></div></div>` : ""}
    </div></div>`;
  mountSheet(true);
  $("#scrim").onclick = $("#iClose").onclick = closeLayer;
  $("#iN").focus();
  $("#iSave").onclick = async () => {
    const n = $("#iN").value.trim(); const p = parseInt($("#iP").value.replace(/[^0-9]/g, ""));
    if (!n) { $("#iErr").textContent = "Ürün adını yazın."; $("#iN").focus(); return; }
    if (isNaN(p)) { $("#iErr").textContent = "Fiyatı rakamla yazın, ör. 45."; $("#iP").focus(); return; }
    if (await act({ type: "menuSave", item: { id: m && m.id, n, d: $("#iD").value, p, c: +$("#iC").value } })) { closeLayer(); toast(m ? "Ürün güncellendi" : "Ürün menüye eklendi"); }
  };
  const del = $("#iDel"); if (del) del.onclick = () => confirmBox("#iBox", `“${m.n}” menüden silinsin mi?`, "Sil", async () => { if (await act({ type: "menuDel", id: m.id })) { closeLayer(); toast("Ürün silindi"); } });
}

function leaders() {
  const week = (S.now || Date.now()) - 7 * 864e5;
  const m = {};
  S.results.filter(r => r.t >= week).forEach(r => r.winners.forEach(n => { m[n] = (m[n] || 0) + 1; }));
  return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 10);
}
function panelLeaders() {
  const lb = leaders();
  const recent = S.results.slice().reverse().slice(0, 8);
  return `
    <p class="sub">Biten her oyunun kazananı otomatik yazılır. TV ekranında da görünür.</p>
    <div class="sec"><div class="sec-h"><span>Bu hafta en çok kazananlar</span></div><div class="group">
      ${lb.length ? lb.map(([n, w], i) => `<div class="row"><span class="rank ${i === 0 ? "first" : ""}">${i + 1}</span><span class="grow">${esc(n)}</span><span class="val">${w} galibiyet</span></div>`).join("") : `<div class="row" style="color:var(--label-2)">Henüz biten oyun yok</div>`}

    <div class="sec"><div class="sec-h"><span>Son oyunlar</span></div><div class="group">
      ${recent.map(r => `<div class="row"><span class="grow"><span class="t">${r.winners.map(esc).join(" & ")} kazandı</span><span class="d">Masa ${r.table}</span></span><span class="val">${ago(r.t)}</span></div>`).join("") || `<div class="row" style="color:var(--label-2)">Yok</div>`}
    </div></div>`;
}

/* ---------- shared ---------- */
function confirmBox(sel, msg, label, fn) {
  $(sel).innerHTML = `<div class="confirm"><span>${esc(msg)}</span><div class="acts"><button class="btn small gray" data-no>Vazgeç</button><button class="btn small red" data-yes>${esc(label)}</button></div></div>`;
  $(sel + " [data-no]").onclick = () => $(sel).innerHTML = "";
  $(sel + " [data-yes]").onclick = async e => { e.target.disabled = true; await fn(); const b = $(sel); if (b) b.innerHTML = ""; };
}
/* ---------- motion: springs (Apple's damping ratio + response), velocity handoff, momentum projection ---------- */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
function spring({ from, to, velocity = 0, damping = 1, response = .35, onUpdate, onDone }) {
  const k = Math.pow(2 * Math.PI / response, 2), c = 4 * Math.PI * damping / response;
  let x = from, v = velocity, last = performance.now(), raf = 0, live = true;
  const step = now => {
    if (!live) return;
    const dt = Math.min(.064, (now - last) / 1000); last = now;
    const n = Math.max(1, Math.ceil(dt / .004)), h = dt / n;
    for (let i = 0; i < n; i++) { const a = -k * (x - to) - c * v; v += a * h; x += v * h; }
    if (Math.abs(x - to) < .5 && Math.abs(v) < 8) { live = false; onUpdate(to); onDone && onDone(); return; }
    onUpdate(x); raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
  return { stop() { live = false; cancelAnimationFrame(raf); return { x, v }; } };
}
const project = (v, rate = .998) => (v / 1000) * rate / (1 - rate);
const rubberband = (over, dim, c = .55) => (over * dim * c) / (dim + c * Math.abs(over));
function haptic() { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }

let sheetCtl = null;
function mountSheet(animateIn) {
  const sheet = $("#layer .sheet"), scrim = $("#layer .scrim");
  if (!sheet || !scrim) return;
  const st = { sheet, y: 0, h: Math.max(1, sheet.offsetHeight), anim: null, closing: false };
  const apply = y => {
    st.y = y;
    sheet.style.transform = `translate3d(0, ${y}px, 0)`;
    scrim.style.opacity = String(Math.min(1, Math.max(0, 1 - y / st.h)));
  };
  const go = (target, velocity, damping, done) => {
    if (st.anim) st.anim.stop();
    st.anim = spring({ from: st.y, to: target, velocity, damping, response: .32, onUpdate: apply, onDone: () => { st.anim = null; done && done(); } });
  };
  st.close = (velocity = 0) => {
    st.closing = true; sheet.classList.add("closing"); scrim.classList.add("closing");
    const remove = () => { if (sheet.isConnected) { sheet.remove(); scrim.remove(); } };
    if (reduceMotion.matches && !drag) {
      sheet.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200 }).onfinish = remove;
      scrim.animate([{ opacity: scrim.style.opacity || 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" });
      return;
    }
    go(st.h + 24, Math.max(velocity, 0), 1, remove);
  };
  if (animateIn && reduceMotion.matches) { apply(0); sheet.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 }); scrim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 }); }
  else if (animateIn) { apply(st.h); go(0, 0, 1); }
  else apply(0);

  // dragging: 1:1 with the finger, interruptible, velocity tracked for the hand-off
  let drag = null, touch = null;
  const begin = y0 => {
    if (st.closing) return;
    if (st.anim) { st.anim.stop(); st.anim = null; }
    drag = { start: y0, base: st.y, hist: [[performance.now(), st.y]] };
    sheet.classList.add("dragging");
  };
  const move = yp => {
    let y = drag.base + (yp - drag.start);
    if (y < 0) y = -rubberband(-y, st.h);
    apply(y);
    const now = performance.now();
    drag.hist.push([now, y]);
    while (drag.hist.length > 2 && now - drag.hist[0][0] > 100) drag.hist.shift();
  };
  const end = () => {
    const h = drag.hist, a = h[0], b = h[h.length - 1];
    const dt = (b[0] - a[0]) / 1000, v = dt > 0 ? (b[1] - a[1]) / dt : 0;
    drag = null; sheet.classList.remove("dragging");
    const landing = st.y + project(v);
    if (landing > st.h * .5 && v > -50) { draft = null; st.close(v); haptic(); render(true); }
    else go(0, v, v < -300 || v > 300 ? .8 : 1);   // a little bounce only when the release carried momentum
  };
  sheet.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || st.closing) return;
    const t = e.touches[0];
    touch = { x: t.clientX, y: t.clientY, header: !!e.target.closest(".grabber, .sheet-nav"), decided: false };
  }, { passive: true });
  sheet.addEventListener("touchmove", e => {
    if (!touch) return;
    const t = e.touches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    if (!touch.decided) {
      if (Math.hypot(dx, dy) < 10) { if (touch.header) e.preventDefault(); return; }
      touch.decided = true;
      const down = Math.abs(dy) > Math.abs(dx);
      if (down && (touch.header || (dy > 0 && sheet.scrollTop <= 0))) begin(t.clientY);
      else { touch = null; return; }
    }
    if (drag) { e.preventDefault(); move(t.clientY); }
  }, { passive: false });
  const touchEnd = () => { if (drag) end(); touch = null; };
  sheet.addEventListener("touchend", touchEnd);
  sheet.addEventListener("touchcancel", touchEnd);
  sheet.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch" || !e.target.closest(".grabber, .sheet-nav") || e.target.closest("button")) return;
    sheet.setPointerCapture(e.pointerId); begin(e.clientY);
    const mv = ev => drag && move(ev.clientY);
    const up = () => { sheet.removeEventListener("pointermove", mv); if (drag) end(); };
    sheet.addEventListener("pointermove", mv);
    sheet.addEventListener("pointerup", up, { once: true });
    sheet.addEventListener("pointercancel", up, { once: true });
  });
  sheetCtl = st;
}
function closeLayer() {
  draft = null;
  if (sheetCtl && sheetCtl.sheet.isConnected) { if (!sheetCtl.closing) sheetCtl.close(0); }
  else $("#layer").innerHTML = "";
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#layer .sheet:not(.closing)")) closeLayer(); });
document.addEventListener("touchstart", () => {}, { passive: true }); // lets :active fire on touch-down in iOS Safari
let scrollTick = false;
window.addEventListener("scroll", () => {
  if (scrollTick) return; scrollTick = true;
  requestAnimationFrame(() => { document.body.classList.toggle("scrolled", window.scrollY > 4); scrollTick = false; });
}, { passive: true });
let toastT;
function toast(msg, ok = true) {
  const t = $("#toast"); t.innerHTML = (ok ? ic("check") : "") + esc(msg); t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200);
}
window.addEventListener("hashchange", () => { closeLayer(); $("#toast").hidden = true; render(true); window.scrollTo(0, 0); });
render(true);
pull();
setInterval(() => { if (!document.hidden) pull(); }, 2500);
setInterval(() => { if (route().v === "tv" && S) render(true); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
})();
</script>
