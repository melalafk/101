<title>101 Okey Skor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — standings strip, hand ledger, sticky "El ekle" bar; hand entry in a bottom sheet. */
:root {
  --bg: #eef1ec;
  --surface: #ffffff;
  --surface-2: #f5f7f3;
  --fg: #1c2420;
  --muted: #66726b;
  --line: #d8ded6;
  --felt: #1f5a43;
  --felt-fg: #ffffff;
  --tile: #fbf8ef;
  --tile-edge: #e3dcc6;
  --t-red: #c8312b;
  --t-blue: #1f5fae;
  --t-black: #23262b;
  --t-yellow: #c98a06;
  --good: #1f7a4d;
  --bad: #b3261e;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1713; --surface: #18221d; --surface-2: #1e2a24; --fg: #e8eee9; --muted: #93a39a;
    --line: #2c3a33; --felt: #2e7a5c; --felt-fg: #ffffff; --tile: #2a2a24; --tile-edge: #3a392f;
    --t-red: #ff6b5e; --t-blue: #6aa5ff; --t-black: #d6dad7; --t-yellow: #f2bd3d;
    --good: #5fd39a; --bad: #ff7b72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1713; --surface: #18221d; --surface-2: #1e2a24; --fg: #e8eee9; --muted: #93a39a;
  --line: #2c3a33; --felt: #2e7a5c; --felt-fg: #ffffff; --tile: #2a2a24; --tile-edge: #3a392f;
  --t-red: #ff6b5e; --t-blue: #6aa5ff; --t-black: #d6dad7; --t-yellow: #f2bd3d;
  --good: #5fd39a; --bad: #ff7b72; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--felt); }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--t-blue); outline-offset: 2px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--felt); color: var(--felt-fg);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: flex; align-items: center; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand .tile { width: 30px; height: 38px; font-size: 20px; }
.brand h1 { margin: 0; font: 700 22px/1 var(--display); letter-spacing: .02em; }
.brand small { display: block; font: 500 12px/1.2 var(--body); opacity: .8; }
.icon-btn {
  background: rgba(255,255,255,.14); border: 0; color: var(--felt-fg); border-radius: 10px;
  padding: 8px 12px; font-weight: 600; font-size: 14px;
}

/* okey tile */
.tile {
  display: inline-grid; place-items: center; border-radius: 6px;
  background: var(--tile); border: 1px solid var(--tile-edge); box-shadow: 0 2px 0 var(--tile-edge);
  font-family: var(--display); font-weight: 700; color: var(--t-red);
}
.c0 { --pc: var(--t-red); } .c1 { --pc: var(--t-blue); } .c2 { --pc: var(--t-black); } .c3 { --pc: var(--t-yellow); }

h2 { font: 600 13px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 24px 0 10px; }

/* setup */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 10px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.small button { padding: 7px; }
.field { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; }
.field + .field { margin-top: 8px; }
.field .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); flex: none; }
.field input { border: 0; background: transparent; padding: 10px 0; flex: 1; min-width: 0; outline: none; font-size: 16px; }
.team-box { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface-2); }
.team-box + .team-box { margin-top: 10px; }
.team-box .lbl { font: 700 16px var(--display); letter-spacing: .03em; margin-bottom: 8px; color: var(--pc); }
.rules { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.rules > * { min-width: 0; }
.rule { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.rule span { min-width: 0; }
.rule small { display: block; color: var(--muted); font-size: 12px; }
.rule input[type="number"] { width: 84px; text-align: right; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface-2); font-size: 16px; }
.rule input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--felt); }

.primary {
  width: 100%; border: 0; border-radius: 14px; padding: 15px; background: var(--felt); color: var(--felt-fg);
  font: 700 19px var(--display); letter-spacing: .04em;
}
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
.danger { color: var(--bad); }

/* standings */
.standings { display: grid; gap: 8px; margin-top: 16px; }
.stand {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
}
.stand.lead { border-color: var(--felt); box-shadow: inset 0 0 0 1px var(--felt); }
.stand .rank { width: 30px; height: 38px; font-size: 20px; color: var(--pc); }
.stand .who { min-width: 0; }
.stand .who b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stand .who small { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stand .total { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; text-align: right; }
.stand .diff { display: block; font: 500 12px var(--body); color: var(--muted); text-align: right; margin-top: 2px; }
.pill { display: inline-block; font: 600 10px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; padding: 3px 6px; border-radius: 99px; background: var(--felt); color: var(--felt-fg); vertical-align: 2px; margin-left: 6px; }

/* ledger */
.ledger-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--line); }
th { font: 600 12px var(--body); color: var(--muted); position: sticky; top: 0; background: var(--surface); }
th .bar { display: block; height: 3px; border-radius: 2px; background: var(--pc); margin: 6px auto 0; width: 70%; }
th.n, td.n { width: 34px; color: var(--muted); font-size: 12px; }
td { font: 600 19px var(--display); }
td small { display: block; font: 500 11px var(--body); color: var(--muted); }
td.fin { color: var(--good); }
td .tag { display: block; font: 600 9px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
tbody tr { cursor: pointer; }
tbody tr:active { background: var(--surface-2); }
tfoot td { font-size: 22px; background: var(--surface-2); border-bottom: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }

.bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.bottombar .primary { max-width: 608px; margin: 0 auto; display: block; box-shadow: 0 6px 18px rgba(0,0,0,.18); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 92vh; overflow-y: auto;
  background: var(--bg); border-radius: 20px 20px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 8px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.sheet-inner { max-width: 608px; margin: 0 auto; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h3 { margin: 0; font: 700 24px var(--display); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--felt); border-color: var(--felt); color: var(--felt-fg); }
.chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--pc); margin-right: 6px; }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--felt-fg); }
.prow { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.prow + .prow { margin-top: 8px; }
.prow.is-fin { border-color: var(--good); }
.prow-top { display: flex; align-items: center; gap: 10px; }
.prow-top .name { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow-top .name::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); margin-right: 8px; }
.prow-top input {
  width: 110px; text-align: right; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  background: var(--surface-2); font: 700 22px var(--display); font-variant-numeric: tabular-nums;
}
.prow-top input:disabled { opacity: .45; }
.sign { flex: none; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font: 700 24px/1 var(--display); color: var(--muted); }
.sign[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--felt-fg); }
.runtot { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.result { min-width: 64px; text-align: right; font: 700 22px var(--display); font-variant-numeric: tabular-nums; }
.result.neg { color: var(--good); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.opt { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
.opt[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-left: auto; }
.stepper button { border: 0; background: var(--surface-2); width: 32px; height: 30px; font-weight: 700; font-size: 16px; }
.stepper span { padding: 0 8px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.sheet-actions { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 16px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--bad); margin-top: 10px; }
.confirm p { margin: 0; flex: 1 1 180px; }
.menu-list { display: grid; gap: 8px; }
.type-row { gap: 8px; }
.type-row .tname { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface-2); font-size: 16px; }
.type-row input[type="number"] { width: 64px; }
.type-row .xm { color: var(--muted); font-weight: 600; }
.tdel { border: 0; background: transparent; color: var(--bad); font-weight: 600; font-size: 13px; padding: 6px 2px; }
.tdel:disabled { opacity: .3; }
.preset { display: inline-flex; align-items: center; }
.preset .chip { border-radius: 99px 0 0 99px; }
.pdel { border: 1px solid var(--line); border-left: 0; background: var(--surface); border-radius: 0 99px 99px 0; padding: 8px 10px; color: var(--muted); font-weight: 700; font-size: 14px; }
.save-preset { display: flex; gap: 8px; margin-top: 10px; }
.save-preset input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); font-size: 16px; }
.menu-list button { text-align: left; }
.hist { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; }
.hist small { color: var(--muted); display: block; font-weight: 400; }
.hint { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }
@media (prefers-reduced-motion: no-preference) {
  .sheet.anim { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: .6; } }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="tile" aria-hidden="true">1</span>
      <div><h1>101 Okey Skor</h1><small id="sub">Skor tablosu</small></div>
    </div>
    <button class="icon-btn" id="menuBtn" hidden>Menü</button>
  </header>
  <main id="app"></main>
</div>
<div id="layer"></div>

<script>
(() => {
const KEY = "okey101.v1";
const COLORS = ["c0", "c1", "c2", "c3"];
const DEFAULT_QUICK = { finish: 101, notOpened: 202, penalty: 101 };
const clone = o => JSON.parse(JSON.stringify(o));

let store = load();
let draft = null; // hand being edited

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === "object") {
      const st = { game: s.game || null, history: s.history || [], setup: s.setup || null };
      [st.game, ...st.history].forEach(fixGame);
      return st;
    }
  } catch (e) {}
  return { game: null, history: [], setup: null };
}
function fixGame(g) {
  if (!g) return;
  const r = g.rules || {};
  g.rules = { hands: r.hands || 0, finish: r.finish || 101, notOpened: r.notOpened || 202, penalty: r.penalty || 101 };
  // older hands stored options (açamadı/çift/ceza); turn them into plain numbers once
  g.hands = g.hands.map(h => h.s ? h : { s: legacyScores(g, h, r) });
}
function legacyScores(g, h, r) {
  const types = r.types || [];
  const t = types.find(x => x.id === h.ft);
  const mult = h.fin == null ? 1 : (t ? t.m : h.mult || 1);
  const fin = r.finish || 101, not = r.notOpened || 202, pen = r.penalty || 101, dbl = r.dbl || 2;
  return g.players.map((_, i) => {
    const p = h.p[i] || {};
    const pe = (p.pen || 0) * pen * (r.multPenalty ? mult : 1);
    if (h.fin === i) return -fin * (r.multFinisher === false ? 1 : mult) + pe;
    if (g.mode === "team" && r.partnerZero && h.fin != null && partnerOf(g, i) === h.fin) return pe;
    if (p.no) return not * (r.multNotOpened === false ? 1 : mult) + pe;
    return (Number(p.v) || 0) * (p.dbl ? dbl : 1) * mult + pe;
  });
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n < 0 ? "−" : "") + Math.abs(n);
const $ = s => document.querySelector(s);

/* ---------- scoring: hands are the numbers people wrote, nothing more ---------- */
function partnerOf(game, i) { const t = game.teams[0].includes(i) ? game.teams[0] : game.teams[1]; return t.find(x => x !== i); }
function totals(game, upto) {
  const t = game.players.map(() => 0);
  game.hands.slice(0, upto == null ? undefined : upto).forEach(h => h.s.forEach((v, i) => t[i] += v));
  return t;
}
function sides(game) {
  const t = totals(game);
  if (game.mode === "team") {
    return game.teams.map((tm, k) => ({
      name: game.teamNames[k], sub: tm.map(i => `${game.players[i]} ${fmt(t[i])}`).join(" · "),
      total: tm.reduce((a, i) => a + t[i], 0), color: COLORS[k],
    }));
  }
  return game.players.map((n, i) => ({ name: n, sub: "", total: t[i], color: COLORS[i] }));
}
const colorOf = (g, i) => g.mode === "team" ? COLORS[g.teams[0].includes(i) ? 0 : 1] : COLORS[i];

/* ---------- views ---------- */
function render() {
  $("#menuBtn").hidden = !store.game;
  if (!store.game) return renderSetup();
  renderGame();
}

function defaultSetup() {
  const s = store.setup || {};
  return {
    mode: s.mode || "single", count: s.count || 4,
    names: s.names || ["", "", "", ""], teamNames: s.teamNames || ["A Takımı", "B Takımı"],
    hands: (s.rules && s.rules.hands) || s.hands || 0,
    quick: { ...DEFAULT_QUICK, ...(s.quick || {}), ...(s.rules ? { finish: s.rules.finish || 101, notOpened: s.rules.notOpened || 202, penalty: s.rules.penalty || 101 } : {}) },
  };
}

function settingsHTML(hands, q) {
  return `<div class="rules">
    <label class="rule"><span>Kaç el oynanacak?<small>0 = sınırsız</small></span><input type="number" id="sHands" inputmode="numeric" value="${hands || 0}"></label>
  </div>
  <h2>Hızlı tuşlar</h2>
  <p class="hint" style="margin:-4px 2px 10px">El girerken tek dokunuşla yazılan sayılar. Masanızın kuralına göre değiştirin.</p>
  <div class="rules">
    <label class="rule"><span>Biten</span><input type="number" id="qFinish" inputmode="numeric" value="${q.finish}"></label>
    <label class="rule"><span>Açamayan</span><input type="number" id="qNot" inputmode="numeric" value="${q.notOpened}"></label>
    <label class="rule"><span>Ceza</span><input type="number" id="qPen" inputmode="numeric" value="${q.penalty}"></label>
  </div>`;
}
function readSettings() {
  const n = (id, d) => { const v = parseInt($(id).value); return isNaN(v) ? d : Math.abs(v); };
  return {
    hands: n("#sHands", 0),
    quick: { finish: n("#qFinish", 101), notOpened: n("#qNot", 202), penalty: n("#qPen", 101) },
  };
}

function renderSetup() {
  const st = defaultSetup();
  $("#sub").textContent = "Yeni oyun";
  const nameField = (i, ph, c) => `<label class="field ${c}"><span class="dot"></span>
      <input id="name${i}" value="${esc(st.names[i] || "")}" placeholder="${ph}" autocomplete="off" maxlength="18"></label>`;
  let players;
  if (st.mode === "team") {
    players = [0, 1].map(k => `<div class="team-box ${COLORS[k]}">
        <div class="lbl"><input id="tname${k}" value="${esc(st.teamNames[k])}" aria-label="Takım adı" style="border:0;background:transparent;font:inherit;color:inherit;width:100%;outline:none" maxlength="18"></div>
        ${nameField(k, "Oyuncu " + (k + 1), COLORS[k])}
        ${nameField(k + 2, "Oyuncu " + (k + 3), COLORS[k])}
      </div>`).join("");
  } else {
    players = `<div class="seg small" id="countSeg" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">
        ${[2, 3, 4].map(c => `<button data-c="${c}" aria-pressed="${st.count === c}">${c} kişi</button>`).join("")}
      </div>` + Array.from({ length: st.count }, (_, i) => nameField(i, "Oyuncu " + (i + 1), COLORS[i])).join("");
  }
  $("#app").innerHTML = `
    <h2>Oyun tipi</h2>
    <div class="seg" id="modeSeg">
      <button data-m="single" aria-pressed="${st.mode === "single"}">Tekli</button>
      <button data-m="team" aria-pressed="${st.mode === "team"}">Eşli (2’ye 2)</button>
    </div>
    <h2>${st.mode === "team" ? "Takımlar" : "Oyuncular"}</h2>
    ${players}
    ${st.mode === "team" ? `<p class="hint">Karşılıklı oturanlar eş olur: 1 ile 3, 2 ile 4.</p>` : ""}
    <h2>Ayarlar</h2>
    ${settingsHTML(st.hands, st.quick)}
    <div style="margin-top:22px"><button class="primary" id="startBtn">Oyunu başlat</button></div>
    ${store.history.length ? `<h2>Geçmiş oyunlar</h2>${historyList()}` : ""}
  `;
  const collect = () => {
    const s = defaultSetup();
    for (let i = 0; i < 4; i++) { const el = $("#name" + i); if (el) s.names[i] = el.value.trim(); }
    [0, 1].forEach(k => { const el = $("#tname" + k); if (el) s.teamNames[k] = el.value.trim() || (k ? "B Takımı" : "A Takımı"); });
    Object.assign(s, readSettings());
    store.setup = s; save();
    return s;
  };
  $("#modeSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; collect(); store.setup.mode = b.dataset.m; save(); renderSetup(); };
  const cs = $("#countSeg");
  if (cs) cs.onclick = e => { const b = e.target.closest("button"); if (!b) return; collect(); store.setup.count = +b.dataset.c; save(); renderSetup(); };
  $("#startBtn").onclick = () => {
    const s = collect();
    const n = s.mode === "team" ? 4 : s.count;
    store.game = {
      id: Date.now(), created: new Date().toISOString(), mode: s.mode,
      players: Array.from({ length: n }, (_, i) => s.names[i] || "Oyuncu " + (i + 1)),
      teams: [[0, 2], [1, 3]], teamNames: [...s.teamNames],
      rules: { hands: s.hands, ...s.quick }, hands: [],
    };
    save(); render();
  };
  bindHistory();
}

function historyList() {
  return `<div class="menu-list">${store.history.slice().reverse().map(g => {
    const sd = sides(g).sort((a, b) => a.total - b.total);
    const d = new Date(g.created);
    return `<button class="ghost hist" data-hid="${g.id}"><span>${esc(sd[0].name)} kazandı
      <small>${d.toLocaleDateString("tr-TR")} · ${g.hands.length} el · ${g.mode === "team" ? "Eşli" : "Tekli"}</small></span>
      <span class="num" style="font-size:20px">${fmt(sd[0].total)}</span></button>`;
  }).join("")}</div>`;
}
function bindHistory() {
  document.querySelectorAll("[data-hid]").forEach(b => b.onclick = () => {
    const g = store.history.find(x => String(x.id) === b.dataset.hid);
    if (!g) return;
    if (store.game && store.game.hands.length) store.history.push(store.game);
    store.history = store.history.filter(x => x.id !== g.id);
    store.game = g; save(); closeLayer(); render();
  });
}

function renderGame() {
  const g = store.game;
  const sd = sides(g);
  const order = sd.map((s, i) => ({ ...s, i })).sort((a, b) => a.total - b.total);
  const best = order[0].total;
  const max = g.rules.hands;
  const done = max && g.hands.length >= max;
  const has = g.hands.length > 0;
  $("#sub").textContent = `${g.mode === "team" ? "Eşli" : "Tekli"} · ${g.hands.length}${max ? " / " + max : ""} el`;

  const stand = order.map((s, r) => `
    <div class="stand ${s.color} ${has && s.total === best ? "lead" : ""}">
      <span class="tile rank">${r + 1}</span>
      <div class="who"><b>${esc(s.name)}${has && s.total === best ? `<span class="pill">${done ? "Kazandı" : "Önde"}</span>` : ""}</b>${s.sub ? `<small>${esc(s.sub)}</small>` : ""}</div>
      <div><span class="total">${fmt(s.total)}</span>${r > 0 && has ? `<span class="diff">+${s.total - best} fark</span>` : ""}</div>
    </div>`).join("");

  let head, rows, foot;
  const tot = totals(g);
  if (g.mode === "team") {
    head = `<th class="n">El</th>` + g.teams.map((tm, k) => `<th class="${COLORS[k]}">${esc(g.teamNames[k])}<span class="bar"></span></th>`).join("");
    rows = g.hands.map((h, hi) => `<tr data-h="${hi}"><td class="n">${hi + 1}</td>${g.teams.map(tm => {
      const sum = tm.reduce((a, i) => a + h.s[i], 0);
      return `<td class="${tm.some(i => h.s[i] < 0) ? "fin" : ""}">${fmt(sum)}<small>${tm.map(i => fmt(h.s[i])).join(" · ")}</small></td>`;
    }).join("")}</tr>`).join("");
    foot = `<td class="n">Σ</td>` + g.teams.map(tm => `<td>${fmt(tm.reduce((a, i) => a + tot[i], 0))}</td>`).join("");
  } else {
    head = `<th class="n">El</th>` + g.players.map((p, i) => `<th class="${COLORS[i]}">${esc(p)}<span class="bar"></span></th>`).join("");
    rows = g.hands.map((h, hi) => `<tr data-h="${hi}"><td class="n">${hi + 1}</td>${h.s.map(v => `<td class="${v < 0 ? "fin" : ""}">${fmt(v)}</td>`).join("")}</tr>`).join("");
    foot = `<td class="n">Σ</td>` + tot.map(t => `<td>${fmt(t)}</td>`).join("");
  }

  $("#app").innerHTML = `
    <div class="standings">${stand}</div>
    <h2>Eller</h2>
    <div class="ledger-wrap">
      ${has ? `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody><tfoot><tr>${foot}</tr></tfoot></table>`
        : `<div class="empty"><b>Henüz el yok</b>El bitince aşağıdan “El ekle”ye bas ve herkesin puanını deftere yazar gibi gir.</div>`}
    </div>
    ${has ? `<p class="hint">Bir eli düzeltmek veya silmek için satırına dokun.</p>` : ""}
    <div class="bottombar"><button class="primary" id="addBtn">${done ? "Oyun bitti · Yeni oyun" : `+ ${g.hands.length + 1}. eli ekle`}</button></div>
  `;
  $("#addBtn").onclick = () => done ? openMenu(true) : openHand(null);
  document.querySelectorAll("tbody tr").forEach(tr => tr.onclick = () => openHand(+tr.dataset.h));
}

/* ---------- hand sheet: one number per player ---------- */
function openHand(idx) {
  const g = store.game;
  const vals = idx == null ? g.players.map(() => "") : g.hands[idx].s.map(String);
  draft = { idx, v: vals, confirmDel: false, fresh: true };
  drawHand();
  draft.fresh = false;
}
const parse = s => { const n = parseInt(String(s).replace(/[^0-9-]/g, "")); return isNaN(n) ? 0 : n; };

function drawHand() {
  const g = store.game;
  const q = g.rules;
  const order = g.mode === "team" ? [0, 2, 1, 3] : g.players.map((_, i) => i);
  const before = totals(g, draft.idx == null ? g.hands.length : draft.idx);
  const handNo = draft.idx == null ? g.hands.length + 1 : draft.idx + 1;

  $("#layer").innerHTML = `
    <div class="scrim" id="scrim"></div>
    <div class="sheet ${draft.fresh ? "anim" : ""}" role="dialog" aria-label="El girişi"><div class="sheet-inner">
      <div class="grab"></div>
      <div class="sheet-head"><h3>${handNo}. el</h3><button class="ghost" id="closeBtn">Kapat</button></div>
      <p class="hint">Herkesin bu eldeki puanını yaz. Biten için eksi tuşuna bas veya hızlı tuşu kullan.</p>
      <div style="margin-top:12px">
      ${order.map(i => {
        const v = draft.v[i]; const neg = String(v).startsWith("-");
        return `<div class="prow ${colorOf(g, i)} ${neg ? "is-fin" : ""}" id="row${i}">
          <div class="prow-top">
            <span class="name">${esc(g.players[i])}</span>
            <button class="sign" data-sign="${i}" aria-pressed="${neg}" aria-label="Eksi yap">−</button>
            <input id="v${i}" data-i="${i}" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="${esc(String(v).replace("-", ""))}">
          </div>
          <div class="opts">
            <button class="opt" data-q="${i}" data-val="${-q.finish}">−${q.finish}</button>
            <button class="opt" data-q="${i}" data-val="${-q.finish * 2}">−${q.finish * 2}</button>
            <button class="opt" data-q="${i}" data-val="${q.notOpened}">${q.notOpened}</button>
            <button class="opt" data-add="${i}">+${q.penalty} ceza</button>
            <span class="runtot" id="t${i}">Toplam ${fmt(before[i] + parse(v))}</span>
          </div>
        </div>`;
      }).join("")}
      </div>
      ${draft.confirmDel ? `<div class="confirm"><p>${handNo}. el silinsin mi?</p><button class="ghost" id="delNo">Vazgeç</button><button class="ghost danger" id="delYes">Sil</button></div>` : ""}
      <div class="sheet-actions">
        ${draft.idx != null ? `<button class="ghost danger" id="delBtn">Sil</button>` : `<span></span>`}
        <button class="primary" id="saveBtn">${draft.idx == null ? "Eli kaydet" : "Değişiklikleri kaydet"}</button>
      </div>
    </div></div>`;

  const sheet = $(".sheet");
  const setVal = (i, val) => { draft.v[i] = val; redraw(sheet); };
  $("#scrim").onclick = $("#closeBtn").onclick = closeLayer;
  sheet.querySelectorAll("input[data-i]").forEach(inp => inp.oninput = () => {
    const i = +inp.dataset.i;
    if (inp.value.includes("-")) { $("[data-sign='" + i + "']").setAttribute("aria-pressed", "true"); }
    const digits = inp.value.replace(/[^0-9]/g, "");
    if (inp.value !== digits) inp.value = digits;
    const neg = $("[data-sign='" + i + "']").getAttribute("aria-pressed") === "true";
    draft.v[i] = digits === "" ? "" : (neg ? "-" : "") + digits;
    $("#t" + i).textContent = "Toplam " + fmt(before[i] + parse(draft.v[i]));
    $("#row" + i).classList.toggle("is-fin", neg && digits !== "");
  });
  sheet.querySelectorAll("[data-sign]").forEach(b => b.onclick = () => {
    const i = +b.dataset.sign; const v = String(draft.v[i]);
    const neg = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", neg);
    const d = v.replace("-", "");
    draft.v[i] = d === "" ? "" : (neg ? "-" : "") + d;
    $("#t" + i).textContent = "Toplam " + fmt(before[i] + parse(draft.v[i]));
    $("#row" + i).classList.toggle("is-fin", neg && d !== "");
    if (neg && d === "") $("#v" + i).focus();
  });
  sheet.querySelectorAll("[data-q]").forEach(b => b.onclick = () => setVal(+b.dataset.q, b.dataset.val));
  sheet.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const i = +b.dataset.add; setVal(i, String(parse(draft.v[i]) + q.penalty)); });
  const del = $("#delBtn"); if (del) del.onclick = () => { draft.confirmDel = true; redraw(sheet); };
  const dn = $("#delNo"); if (dn) dn.onclick = () => { draft.confirmDel = false; redraw(sheet); };
  const dy = $("#delYes"); if (dy) dy.onclick = () => { g.hands.splice(draft.idx, 1); save(); closeLayer(); render(); };
  $("#saveBtn").onclick = () => {
    const h = { s: draft.v.map(parse) };
    if (draft.idx == null) g.hands.push(h); else g.hands[draft.idx] = h;
    save(); closeLayer(); render();
    window.scrollTo({ top: document.body.scrollHeight });
  };
}
function redraw(sheet) { const y = sheet.scrollTop; drawHand(); $(".sheet").scrollTop = y; }
function closeLayer() { $("#layer").innerHTML = ""; draft = null; }

/* ---------- menu ---------- */
function openMenu(confirmNew) {
  const g = store.game;
  $("#layer").innerHTML = `
    <div class="scrim" id="scrim"></div>
    <div class="sheet anim" role="dialog" aria-label="Menü"><div class="sheet-inner">
      <div class="grab"></div>
      <div class="sheet-head"><h3>Menü</h3><button class="ghost" id="closeBtn">Kapat</button></div>
      <h2>Bu oyun</h2>
      <div class="menu-list">
        <button class="ghost" id="newBtn">Yeni oyun başlat</button>
        <button class="ghost" id="sameBtn">Aynı oyuncularla yeniden başla</button>
        <button class="ghost" id="setBtn">Ayarlar</button>
      </div>
      <div id="confirmBox"></div>
      <p class="hint">Biten oyun “Geçmiş oyunlar”a kaydedilir.</p>
      ${store.history.length ? `<h2>Geçmiş oyunlar</h2>${historyList()}` : ""}
    </div></div>`;
  $("#scrim").onclick = $("#closeBtn").onclick = closeLayer;
  const ask = (msg, fn) => {
    $("#confirmBox").innerHTML = `<div class="confirm"><p>${msg}</p><button class="ghost" id="cNo">Vazgeç</button><button class="ghost danger" id="cYes">Evet</button></div>`;
    $("#cNo").onclick = () => $("#confirmBox").innerHTML = "";
    $("#cYes").onclick = fn;
  };
  const archive = () => { if (g.hands.length) store.history.push(g); store.history = store.history.slice(-30); };
  $("#newBtn").onclick = () => ask("Bu oyun kapanıp yeni oyun kurulsun mu?", () => { archive(); store.game = null; save(); closeLayer(); render(); window.scrollTo(0, 0); });
  $("#sameBtn").onclick = () => ask("Skorlar sıfırlanıp aynı oyuncularla başlansın mı?", () => {
    archive(); store.game = { ...clone(g), id: Date.now(), created: new Date().toISOString(), hands: [] };
    save(); closeLayer(); render(); window.scrollTo(0, 0);
  });
  $("#setBtn").onclick = openSettings;
  if (confirmNew) $("#newBtn").click();
  bindHistory();
}
function openSettings() {
  const g = store.game;
  $("#layer").innerHTML = `
    <div class="scrim" id="scrim"></div>
    <div class="sheet anim" role="dialog" aria-label="Ayarlar"><div class="sheet-inner">
      <div class="grab"></div>
      <div class="sheet-head"><h3>Ayarlar</h3><button class="ghost" id="closeBtn">Kapat</button></div>
      <div style="margin-top:12px">${settingsHTML(g.rules.hands, g.rules)}</div>
      <div style="margin-top:16px"><button class="primary" id="setSave">Kaydet</button></div>
    </div></div>`;
  $("#scrim").onclick = $("#closeBtn").onclick = closeLayer;
  $("#setSave").onclick = () => { const s = readSettings(); g.rules = { hands: s.hands, ...s.quick }; save(); closeLayer(); render(); };
}
$("#menuBtn").onclick = () => openMenu(false);

render();
})();
</script>
